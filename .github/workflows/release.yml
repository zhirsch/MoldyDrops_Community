# Packages MoldyDrops_Community with the BigWigs packager (.pkgmeta) and
# publishes a GitHub release with the zip whenever a tag is pushed:
#   git tag -a 2026.11.24 -m "Community data, 24 November 2026"
#   git push origin 2026.11.24
# Uploads to CurseForge, WoWInterface or Wago happen too once their secrets
# and project IDs (## X-Curse-Project-ID etc. in the .toc) are set.
name: Package and release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub, nothing to add

    steps:
      - name: Check out (full history, for the changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
